name: Scale Estate Intelligence

on:
  push:
    branches:
      - scale/estate-intelligence
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scale-estate-intelligence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Agent A lint
        run: |
          ruff check \
            src/fde_powerhouse/gatling_estate.py \
            src/fde_powerhouse/scale_orchestrator.py \
            src/fde_powerhouse/scale_cli.py \
            tests/test_gatling_estate.py \
            tests/test_scale_orchestrator.py \
            tests/test_scale_cli.py

      - name: Installed launcher smoke
        run: scale-fde-demo --help >/dev/null

      - name: Compile
        run: python -m compileall -q src tests

      - name: Full regression + coverage gate
        run: pytest --cov=fde_powerhouse --cov-report=term-missing --cov-fail-under=70

      - name: Validate Agent A machine artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from fde_powerhouse.gatling_estate import (
              graph_semantic_digest,
              semantic_digest,
          )

          graph = json.loads(Path("shared/SCALE_CAPABILITY_GRAPH.json").read_text())
          workstream = json.loads(Path("shared/WORKSTREAM_A.json").read_text())
          required = {
              "repository",
              "revision",
              "capability",
              "implementation_paths",
              "tests",
              "receipts",
              "dependencies",
              "maturity",
              "verified_state",
              "scale_relevance",
              "known_defects",
              "donor_value",
          }
          maturities = {"prototype", "working", "hardened", "production"}

          assert graph["workstream"] == "A"
          assert workstream["workstream"] == "A"
          assert graph["nodes"]
          for node in graph["nodes"]:
              missing = required - set(node)
              assert not missing, (node.get("repository"), sorted(missing))
              assert node["maturity"] in maturities
              assert not isinstance(node["donor_value"], bool)
              assert 0 <= node["donor_value"] <= 10

          sort_key = lambda node: (
              node["repository"].casefold(),
              node["capability"].casefold(),
              node["revision"],
              tuple(node["implementation_paths"]),
          )
          assert graph["nodes"] == sorted(graph["nodes"], key=sort_key)

          digest_forward = semantic_digest({"nodes": graph["nodes"]})
          digest_reverse = semantic_digest({"nodes": list(reversed(graph["nodes"]))})
          assert digest_forward == digest_reverse

          known_repositories = {node["repository"] for node in graph["nodes"]}
          allowed_relations = set(graph["edge_contract"]["relations"])
          edges = graph["edges"]
          assert edges
          for edge in edges:
              assert edge["source"] in known_repositories
              assert edge["target"] in known_repositories
              assert edge["relation"] in allowed_relations
              assert isinstance(edge["evidence"], list) and edge["evidence"]
              for evidence in edge["evidence"]:
                  for field in ("repository", "revision", "path", "blob_sha", "claim"):
                      assert evidence.get(field) not in (None, "")

          critical = graph["mission_critical_subgraph"]["repositories"]
          assert critical
          assert set(critical).issubset(known_repositories)

          graph_digest_forward = graph_semantic_digest(graph)
          graph_reversed = {
              **graph,
              "nodes": list(reversed(graph["nodes"])),
              "edges": list(reversed(graph["edges"])),
              "mission_critical_subgraph": {
                  **graph["mission_critical_subgraph"],
                  "repositories": list(reversed(critical)),
              },
          }
          graph_digest_reverse = graph_semantic_digest(graph_reversed)
          assert graph_digest_forward == graph_digest_reverse

          evidence_levels = graph["evidence_model"]["ordering"]
          observed_counts = {level: 0 for level in evidence_levels}
          for node in graph["nodes"]:
              assert node["evidence_level"] in observed_counts
              observed_counts[node["evidence_level"]] += 1
          assert observed_counts == graph["evidence_model"]["current_counts"]

          print(
              json.dumps(
                  {
                      "nodes": len(graph["nodes"]),
                      "edges": len(edges),
                      "mission_critical_repositories": len(critical),
                      "semantic_digest": digest_forward,
                      "semantic_reverse_match": True,
                      "graph_semantic_digest": graph_digest_forward,
                      "graph_semantic_reverse_match": True,
                      "evidence_counts": observed_counts,
                      "workstream_state": workstream["state"],
                  },
                  sort_keys=True,
              )
          )
          PY
