name: Scale Workstream C

on:
  pull_request:
    branches: [main]
    paths:
      - "src/fde_powerhouse/scale_compounding.py"
      - "tests/test_scale_compounding.py"
      - ".github/workflows/scale-workstream-c.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Agent C contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint Agent C test surface
        run: ruff check tests/test_scale_compounding.py

      - name: Run Agent C contract
        run: pytest -q tests/test_scale_compounding.py
