name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests

      - name: Tests with coverage gate
        run: |
          pytest --cov=fde_powerhouse --cov-report=term-missing --cov-fail-under=70

      - name: Doctor
        run: python -m fde_powerhouse doctor

      - name: Demo
        run: python -m fde_powerhouse demo

  mega-skills-pinned:
    name: Pinned mega-skills validate
    runs-on: ubuntu-latest
    # Private estate checkout: uses GITHUB_TOKEN (same-org) or optional PAT
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned mega-skills
        uses: actions/checkout@v4
        continue-on-error: true
        id: mega_checkout
        with:
          repository: GlacierEQ/mega-skills
          ref: c100fbb3b603d5cc3141c3dd8755c2d0f62ac39a
          path: mega-skills
          token: ${{ secrets.ESTATE_CHECKOUT_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install powerhouse
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Live invoke validate-only (pinned)
        if: steps.mega_checkout.outcome == 'success'
        env:
          FDE_PATH_MEGA_SKILLS: ${{ github.workspace }}/mega-skills
        run: |
          python -m fde_powerhouse invoke --pipeline control-plane --validate-only
          python -m fde_powerhouse invoke --pipeline inception-to-deployment --validate-only

      - name: Skip note when checkout unavailable
        if: steps.mega_checkout.outcome != 'success'
        run: |
          echo "mega-skills checkout unavailable (private repo token?)."
          echo "Set repository secret ESTATE_CHECKOUT_TOKEN with read access to GlacierEQ/mega-skills."
          echo "Pin remains configs/pins.yaml → c100fbb3b603d5cc3141c3dd8755c2d0f62ac39a"
