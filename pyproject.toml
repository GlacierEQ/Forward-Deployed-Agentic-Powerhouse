[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fde-powerhouse"
version = "0.6.1"
description = "Forward Deployed Agentic Powerhouse — maximized universal cycle"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Casey Barton", email = "GLACIER.EQUILIBRIUM@GMAIL.COM" }]
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "pytest-cov>=5.0"]

[project.scripts]
fde-powerhouse = "fde_powerhouse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
source = ["fde_powerhouse"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 70
