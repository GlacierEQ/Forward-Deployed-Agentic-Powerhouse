# Leading-edge public tech library
# Homepages for continuous edge-catching — tech news, dev news, declassified/public technical
schema: fde.leading_edge_sources/v1
purpose: continuous_public_tech_edge
policy:
  public_only: true
  no_paywall_scraping_claims: true
  refresh_hint: poll_homepages_and_rss_where_available

categories:
  tech_news:
    description: General and industry tech news homepages
    sources:
      - id: techcrunch
        name: TechCrunch
        homepage: https://techcrunch.com/
        focus: [startups, funding, consumer_tech]
      - id: the_verge
        name: The Verge
        homepage: https://www.theverge.com/
        focus: [consumer_tech, policy, products]
      - id: ars_technica
        name: Ars Technica
        homepage: https://arstechnica.com/
        focus: [deep_tech, science, policy]
      - id: wired
        name: WIRED
        homepage: https://www.wired.com/
        focus: [culture, security, AI]
      - id: mit_tech_review
        name: MIT Technology Review
        homepage: https://www.technologyreview.com/
        focus: [research, AI, climate, biotech]
      - id: ieee_spectrum
        name: IEEE Spectrum
        homepage: https://spectrum.ieee.org/
        focus: [engineering, hardware, standards]
      - id: venturebeat
        name: VentureBeat
        homepage: https://venturebeat.com/
        focus: [AI, enterprise, games]
      - id: protocol_sf
        name: Protocol (archive/redirect aware)
        homepage: https://www.protocol.com/
        focus: [policy, platforms]
      - id: rest_of_world
        name: Rest of World
        homepage: https://restofworld.org/
        focus: [global_tech, emerging_markets]
      - id: semi_analysis
        name: SemiAnalysis
        homepage: https://www.semianalysis.com/
        focus: [semiconductors, AI_infra, supply_chain]

  ai_frontier:
