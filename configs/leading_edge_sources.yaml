        homepage: https://arxiv.org/list/cs.AI/recent
        focus: [AI_recent]
      - id: arxiv_cs_lg
        name: arXiv cs.LG
        homepage: https://arxiv.org/list/cs.LG/recent
        focus: [ML_recent]
      - id: arxiv_cs_cl
        name: arXiv cs.CL
        homepage: https://arxiv.org/list/cs.CL/recent
        focus: [NLP_recent]
      - id: arxiv_cs_se
        name: arXiv cs.SE
        homepage: https://arxiv.org/list/cs.SE/recent
        focus: [software_engineering]
      - id: papers_with_code
