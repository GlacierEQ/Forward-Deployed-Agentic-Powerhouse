      - id: anthropic_news
        name: Anthropic News
        homepage: https://www.anthropic.com/news
        focus: [models, safety, research]
      - id: deepmind_blog
        name: Google DeepMind Blog
        homepage: https://deepmind.google/discover/blog/
        focus: [research, agents, science]
      - id: meta_ai_blog
        name: Meta AI Blog
        homepage: https://ai.meta.com/blog/
        focus: [open_models, research]
      - id: huggingface_blog
        name: Hugging Face Blog
        homepage: https://huggingface.co/blog
        focus: [open_source, models, tools]
      - id: microsoft_research
        name: Microsoft Research Blog
        homepage: https://www.microsoft.com/en-us/research/blog/
