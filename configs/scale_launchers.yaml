schema: glaciereq.scale-fde-launchers.v1
max_workers: 4
policy:
  mission_truth_authority: ScaleControlPlane + Workstream E
  launch_success_is_not_mission_completion: true
  shell_execution: forbidden
  crash_replay: explicit_only
  note: >-
    This file binds the canonical Scale mission workstreams to existing executable
    proof/runtime surfaces. It does not move sibling ownership into Agent A.

workstreams:
  A:
    role: estate_intelligence_gatling
    deps: []
    command: null
    source_repository: GlacierEQ/Forward-Deployed-Agentic-Powerhouse
    source_branch: scale/estate-intelligence
    completion:
      artifact: shared/WORKSTREAM_A.json
      pointer: terminal_condition.workstream_a_complete
      equals: true
    evidence_boundary: >-
      A is already complete when its owned machine artifact readback proves the
      terminal flag. The launcher must not rerun estate discovery merely to
      manufacture activity.

  B:
    role: runtime_swarm_durability
    deps: [A]
    source_repository: GlacierEQ/computer-user
    source_branch: scale/runtime-swarm
    source_revision: dd9ea50bce265d5ffc235999909e4ee9b08a4732
    cwd: ${SCALE_FDE_RUNTIME_SWARM_ROOT}
    timeout_seconds: 1800
    command:
      - python3
      - -m
      - pytest
      - -q
      - tests/test_scale_runtime_durability.py
    evidence_boundary: >-
      Executes the recovered durable-runtime proof surface, including lease
      fencing, process-death continuation, reconcile-on-ambiguity, bounded retry,
      deferred continuation and parallel DAG frontier. A zero exit proves this
      launch unit, not Workstream-B mission completion.

  C:
    role: memory_composition_compounding
    deps: [A]
    source_repository: GlacierEQ/Forward-Deployed-Agentic-Powerhouse
    source_branch: scale/memory-composition
    source_revision: 7bbafb8d6d6eb156cc2527bdb8df53f3c08f197e
    cwd: ${SCALE_FDE_MEMORY_COMPOSITION_ROOT}
    timeout_seconds: 1800
    command:
      - python3
      - -m
      - fde_powerhouse.scale_compounding
      - prove
      - --workdir
      - .verification-artifacts/scale-c
    evidence_boundary: >-
      Runs the recovered Aspen Grove + Genius compounding proof. Canonical
      Mission-1 capability registration remains gated on Workstream-E's verified
      mission receipt exactly as Workstream C requires.

  D:
    role: integration_mcp_sigma_glue
    deps: [A]
    source_repository: GlacierEQ/sigma-glue
    source_branch: scale/integration-mcp
    source_revision: a910c04402d99ea811c19a7700ea879ed9e267e7
    cwd: ${SCALE_FDE_INTEGRATION_MCP_ROOT}
    timeout_seconds: 1800
    command:
      - node
      - --test
      - tests/scale-multi-provider-integration.test.mjs
      - tests/provider-boundary-proof.test.mjs
    evidence_boundary: >-
      Executes the recovered sigma-glue integration and provider-boundary proof
      surfaces. It does not claim the still-required live Sigma-to-deployed-Colossus
      route/readback proof.

  E:
    role: independent_verification_scale_product
    deps: [A]
    source_repository: GlacierEQ/computer-user
    source_branch: scale/verification-product
    source_revision: d0550aa93896343c01b4f9aaf80c845b7e4dcf90
    cwd: ${SCALE_FDE_VERIFICATION_PRODUCT_ROOT}
    timeout_seconds: 1800
    command:
      - bash
      - scripts/ci/scale_agent_e_verify.sh
    evidence_boundary: >-
      Executes the independent verifier implementation proof and emits its
      source-bound verification artifact. E still refuses mission certification
      until the canonical baseline/full-stack and provider-readback inputs exist.
